[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempid"
version = "1.0.0"
description = "Unique IDs that automatically expire — like UUID but with a TTL"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Rahul Vachhani", email = ""}]
keywords = [
    "id","uuid","token", "expiry", "ttl", "jwt", "auth",
    "password-reset", "magic-link", "otp", "invite",
    "signed-url", "temporary"
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage      = "https://github.com/VachhaniRahul/TempID-PyPI-Repo"
Documentation = "https://github.com/VachhaniRahul/TempID-PyPI-Repo#readme"
Issues        = "https://github.com/VachhaniRahul/TempID-PyPI-Repo/issues"
Changelog     = "https://github.com/VachhaniRahul/TempID-PyPI-Repo/releases"

[project.optional-dependencies]
redis = ["redis>=4.0"]
dev   = ["pytest>=7", "ruff", "mypy"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["tempid*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
tempid = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
