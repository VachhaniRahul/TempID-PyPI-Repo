name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Instantly cache dependencies for blazing fast builds

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[all,dev]

    - name: Lint and Format (Ruff)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check .
        # Enforce code formatting
        ruff format --check .

    - name: Type Check (Mypy)
      run: |
        mypy tempid/

    - name: Run Tests & Coverage
      run: |
        pytest --cov=tempid --cov-report=term --cov-report=xml --cov-fail-under=65
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false # Don't fail the build if codecov upload fails
